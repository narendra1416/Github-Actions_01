name: Kubernetes CI
on:
  push:
    branches:
      - main
    paths-ignore:
      - flask-minikube/k8s/deployment.yaml
jobs:
  pyapp-cli:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short image tag
        run: echo "IMAGE_TAG=$(git rev-parse --short=7 "$GITHUB_SHA")" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build \
            -t "$DOCKERHUB_USERNAME/flask-minikube:$IMAGE_TAG" \
            -f flask-minikube/Dockerfile flask-minikube
          docker push "$DOCKERHUB_USERNAME/flask-minikube:$IMAGE_TAG"

      - name: Update deployment image tag
        run: |
          sed -i "s|image:.*|image: $DOCKERHUB_USERNAME/flask-minikube:$IMAGE_TAG|" flask-minikube/k8s/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flask-minikube/k8s/deployment.yaml
          git commit -m "Update deployment image to $IMAGE_TAG"
          git push

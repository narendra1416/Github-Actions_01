# Inputs Parameters in workflow 

name: Input Parameters Anton
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Choose the environment to deploy'
        required: true
        default: 'dev'
jobs:
  inputs-anton:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the App
        run: echo "Deploying the application to ${{inputs.environment}}"

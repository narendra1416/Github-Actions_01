# Inputs Parameters in workflow 

name: Input Parameters Anton
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Choose the environment to deploy'
        required: true
        type: choice
        default: 'dev'
        options:
          - dev
          - staging
          - production
      artifact_tags:
        description: 'Enter git tags for the deployment'
        required: true
jobs:
  inputs-anton:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the App
        run: echo "Deploying the ${{inputs.artifact_tags}} application to ${{inputs.environment}}"

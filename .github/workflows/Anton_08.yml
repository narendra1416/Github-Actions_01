# Context Variables

name: Context Variables Anton
on:
  workflow_dispatch:   
jobs:
  context-anton:
    runs-on: ubuntu-latest
    steps:
      - name: Use Context Variables
        run: |
          echo "This workflow is triggered by the ${{github.event_name}}"
          echo "The repository name is ${{github.repository}}"
          echo "The branch is ${{github.ref_name}}"
      
      - name: Print all variables
        run: echo "${{toJson(github)}}"

      - name: Print all variables under github
        run: echo "${{toJson(github)}}"

      - name: Print environment variables
        run: echo "$GITHUB_SHA"